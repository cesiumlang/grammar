name: Grammar Tests

# For pull requests into main and pushes to main, and by hand
# (`gh workflow run test.yml --ref BRANCH`); not for dev, which the standing
# pull request from dev to main checks (emanspeaks, 2026-11-21).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run grammar tests
      run: npm test

    - name: Generate test snapshots (on failure)
      if: failure()
      run: npm run test:snap
      continue-on-error: true
